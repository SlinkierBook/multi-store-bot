{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

<form method="POST">
    <label>Email:</label>
    <input type="email" name="email" required>
    
    <label>Senha:</label>
    <input type="password" name="password" required>
    
    <button type="submit">Entrar</button>
</form>

<a href="/register">Não tem conta? Cadastre-se</a>
{% endblock %}
