{% extends "base.html" %}

{% block content %}
<h1>Produtos</h1>

<a href="/logout">Logout</a>
<a href="/monitor">Monitorar</a>
<a href="/backup">Backup</a>

<h2>Cadastrar Produto</h2>
<form method="POST" action="/add_product">
    <label>Nome:</label>
    <input type="text" name="name" required>
    
    <label>URL:</label>
    <input type="url" name="url" required>
    
    <label>Preço alvo (opcional):</label>
    <input type="number" name="target" step="0.01">
    
    <button type="submit">Cadastrar</button>
</form>

<h2>Meus Produtos</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Loja</th>
        <th>Target</th>
        <th>Ações</th>
    </tr>
    {% for p in products %}
    <tr>
        <td>{{ p[0] }}</td>
        <td>{{ p[2] }}</td>
        <td>{{ p[4] }}</td>
        <td>£{{ p[5] }}</td>
        <td><a href="/history/{{ p[0] }}">Histórico</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
