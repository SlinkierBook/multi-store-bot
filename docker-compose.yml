services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  bot:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot
    depends_on:
      - db
    restart: unless-stopped